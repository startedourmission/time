name: 이슈 담당자 응답

on:
  issues:
    types: [opened]

jobs:
  respond:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: 담당자 응답
        uses: actions/github-script@v7
        with:
          script: |
            const responses = [
              "접수되었습니다. 담당팀에 전달했습니다.",
              "알려주셔서 감사합니다. 검토 후 연락드리겠습니다.",
              "재현 환경을 파악 중입니다. 답변이 늦을 수 있습니다.",
              "우선순위 검토 중입니다. 조금만 기다려 주세요.",
              "동일 증상을 겪고 있는 다른 사용자들도 있습니다. 함께 검토하겠습니다.",
              "패치 일정을 확인 중입니다. 진행 상황이 생기면 업데이트하겠습니다.",
            ];

            const comment = responses[Math.floor(Math.random() * responses.length)];

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment,
            });
